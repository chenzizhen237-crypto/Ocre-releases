# Builds the Ocre desktop app (macOS, Apple Silicon) from the private chenzizhen237-crypto/Ocre-dev
# source and publishes it here, where the in-app updater reads latest-mac.yml.
# The release files live in this public repo; the source stays private.
#
# Started by a v* tag in Ocre-dev (its release.yml sends a repository_dispatch) or by hand from the
# Actions tab. Neither trigger can come from a fork or a pull request, so the secret stays here.
# A dry run builds and packages any branch or tag and keeps the installers as run artifacts for a
# few days, without touching releases. Ocre-dev's release-checks.yml runs the release tests on the
# same tag.
#
# Secret: OCRE_SOURCE_TOKEN, a fine-grained personal access token with "Contents: read-only" on
# chenzizhen237-crypto/Ocre-dev. Publishing uses this repo's own GITHUB_TOKEN.
#
# This repo is public, so the run logs are too: they show build output, not source.
name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in chenzizhen237-crypto/Ocre-dev to build, e.g. v0.3.4 (any branch or tag for a dry run)
        required: true
      dry_run:
        description: Build and package without publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the release in this repo

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  SOURCE_REF: ${{ (inputs.dry_run && (github.event.client_payload.tag || inputs.tag)) || format('refs/tags/{0}', github.event.client_payload.tag || inputs.tag) }}
  CARGO_TERM_COLOR: always

jobs:
  mac:
    # The self-hosted runner on Lucas's Mac (Apple silicon, label "release"): GitHub's hosted macOS arm64
    # runners were too short of capacity to pick up jobs. Only dispatch and manual runs reach it, never
    # a pull request, so fork code can't run there.
    runs-on: [self-hosted, macOS, ARM64, release]
    timeout-minutes: 60
    steps:
      - name: Check the tag
        if: env.DRY_RUN != 'true'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: '$TAG'"; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: chenzizhen237-crypto/Ocre-dev
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.OCRE_SOURCE_TOKEN }}
          persist-credentials: false
          path: src
          fetch-depth: 0
      - name: Tag matches apps/desktop/package.json version
        if: env.DRY_RUN != 'true'
        working-directory: src
        run: |
          v=$(node -p 'require("./apps/desktop/package.json").version')
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG but apps/desktop/package.json says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache: a poisoned cache entry would end up inside published installers.
          package-manager-cache: false
      - working-directory: src
        run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - working-directory: src
        run: pnpm install --frozen-lockfile
      - name: Build and package (engine, app, dmg, zip, latest-mac.yml)
        working-directory: src
        run: pnpm --filter ./apps/desktop dist && ls -l apps/desktop/dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the dry-run installers
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ocre-mac
          path: |
            src/apps/desktop/dist/*.dmg
            src/apps/desktop/dist/*.zip
          retention-days: 3
          if-no-files-found: error
      - name: Release notes
        if: env.DRY_RUN != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "Ocre $VERSION for macOS (Apple Silicon)."
            echo
            echo "Not notarised: the first time, right-click Ocre in Applications and choose Open."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$TAG"
            else
              git log --no-merges --pretty='- %s' -n 40 "$TAG"
            fi
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=src/apps/desktop/dist
          files=("$d"/*.dmg "$d"/*.dmg.blockmap "$d"/*.zip "$d"/*.zip.blockmap "$d"/latest-mac.yml)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --title "Ocre $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target main
          fi
